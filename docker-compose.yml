services:
  postgres:
    image: postgres:16
    container_name: sqlagent-postgres
    environment:
      POSTGRES_USER: sqlagent
      POSTGRES_PASSWORD: sqlagent
      POSTGRES_DB: tpch
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlagent -d tpch"]
      interval: 2s
      timeout: 5s
      retries: 30

  server:
    profiles: ["full"]
    build:
      context: .
      target: sqlagent
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SQLAGENT_PG_DSN: postgres://sqlagent:sqlagent@postgres:5432/tpch?sslmode=disable
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      LLM_API_KEY_ENV: ${LLM_API_KEY_ENV:-OPENAI_API_KEY}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  prometheus:
    profiles: ["full"]
    image: prom/prometheus:v2.53.5
    depends_on:
      server:
        condition: service_started
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    profiles: ["full"]
    image: grafana/grafana:11.3.4
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  pgdata:
