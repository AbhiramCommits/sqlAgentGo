services:
  postgres:
    image: postgres:16
    container_name: sqlagent-postgres
    environment:
      POSTGRES_USER: sqlagent
      POSTGRES_PASSWORD: sqlagent
      POSTGRES_DB: tpch
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlagent -d tpch"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
